            - text: "10 · In what manner we ought to bear sickness"
              href: en/diatribe/3-10.qmd
            - text: "11 · Certain miscellaneous matters"
              href: en/diatribe/3-11.qmd
            - text: "12 · About exercise"
              href: en/diatribe/3-12.qmd
            - text: "13 · What solitude is, and what kind of person a solitary man is"
              href: en/diatribe/3-13.qmd
            - text: "14 · Certain miscellaneous matters"
              href: en/diatribe/3-14.qmd
            - text: "15 · That we ought to proceed with circumspection to every thing"
              href: en/diatribe/3-15.qmd
            - text: "16 · That we ought with caution to enter into familiar intercourse with men"
              href: en/diatribe/3-16.qmd
            - text: "17 · On Providence"
              href: en/diatribe/3-17.qmd
            - text: "18 · That we ought not to be disturbed by any news"
