            - text: "9 · That when we cannot fulfil that which the character of a man promises, we assume the character of a philosopher"
              href: en/diatribe/2-09.qmd
            - text: "10 · How we may discover the duties of life from names"
              href: en/diatribe/2-10.qmd
            - text: "11 · What the beginning of philosophy is"
