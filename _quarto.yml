            - text: "17 · How we must adapt preconceptions to particular cases"
              href: en/diatribe/2-17.qmd
            - text: "18 · How we should struggle against appearances"
              href: en/diatribe/2-18.qmd
            - text: "19 · Against those who embrace philosophical opinions only in words"
              href: en/diatribe/2-19.qmd
            - text: "20 · Against the Epicureans and Academics"
              href: en/diatribe/2-20.qmd
            - text: "21 · Of inconsistency"
              href: en/diatribe/2-21.qmd
            - text: "22 · On friendship"
              href: en/diatribe/2-22.qmd
            - text: "23 · On the power of speaking"
              href: en/diatribe/2-23.qmd
            - text: "24 · To (or against) a person who was one of those who were not valued (esteemed) by him"
              href: en/diatribe/2-24.qmd
            - text: "25 · That logic is necessary"
