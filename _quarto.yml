    - id: grc
      style: docked
      collapse-level: 1
      contents:
        - text: '[Italiano]{.ep-lang data-lang="it"}'
          href: it/index.qmd
        - text: '[English]{.ep-lang data-lang="en"}'
          href: en/index.qmd
        - text: '[Ἑλληνιστί]{.ep-lang data-lang="grc"}'
          href: grc/index.qmd
        - text: "---"
        - text: "Ἀρχή"
          href: grc/index.qmd
        - text: "Ἀρριανοῦ ἐπιστολή"
          href: grc/diatribe/0-00.qmd
        - text: "---"
        - section: "Βιβλίον Αʹ"
          contents:
            - text: "αʹ · περὶ τῶν ἐφʼ ἡμῖν καὶ οὐκ ἐφʼ ἡμῖν"
              href: grc/diatribe/1-01.qmd
            - text: "βʹ · πῶς ἄν τις σῴζοι τὸ κατὰ πρόσωπον ἐν παντί"
              href: grc/diatribe/1-02.qmd
            - text: "γʹ · πῶς ἄν τις ἀπὸ τοῦ τὸν θεὸν πατέρα εἶναι τῶν ἀνθρώπων ἐπὶ τὰ ἑξῆς ἐπέλθοι"
              href: grc/diatribe/1-03.qmd
            - text: "δʹ · περὶ προκοπῆς"
              href: grc/diatribe/1-04.qmd
            - text: "εʹ · πρὸς τοὺς Ἀκαδημαικούς"
              href: grc/diatribe/1-05.qmd
            - text: "ϛʹ · περὶ προνοίας"
              href: grc/diatribe/1-06.qmd
            - text: "ζʹ · περὶ τῆς χρείας τῶν μεταπιπτόντων καὶ ὑποθετικῶν καὶ τῶν ὁμοίων"
              href: grc/diatribe/1-07.qmd
            - text: "ηʹ · ὅτι αἱ δυνάμεις τοῖς ἀπαιδεύτοις οὐκ ἀσφαλεῖς"
              href: grc/diatribe/1-08.qmd
            - text: "θʹ · πῶς ἀπὸ τοῦ συγγενεῖς ἡμᾶς εἶναι τῷ θεῷ ἐπέλθοι ἄν τις ἐπὶ τὰ ἑξῆς"
              href: grc/diatribe/1-09.qmd
            - text: "ιʹ · πρὸς τοὺς περὶ τὰς ἐν Ῥώμῃ προαγωγὰς ἐσπουδακότας"
              href: grc/diatribe/1-10.qmd
            - text: "ιαʹ · περὶ φιλοστοργίας"
              href: grc/diatribe/1-11.qmd
            - text: "ιβʹ · περὶ εὐαρεστήσεως"
              href: grc/diatribe/1-12.qmd
            - text: "ιγʹ · πῶς ἕκαστα ἔστιν ποιεῖν ἀρεστῶς θεοῖς"
              href: grc/diatribe/1-13.qmd
            - text: "ιδʹ · ὅτι πάντας ἐφορᾷ τὸ θεῖον"
              href: grc/diatribe/1-14.qmd
            - text: "ιεʹ · τί ἐπαγγέλλεται φιλοσοφία"
              href: grc/diatribe/1-15.qmd
            - text: "ιϛʹ · περὶ προνοίας"
              href: grc/diatribe/1-16.qmd
            - text: "ιζʹ · ὅτι ἀναγκαῖα τὰ λογικά"
              href: grc/diatribe/1-17.qmd
            - text: "ιηʹ · ὅτι οὐ δεῖ χαλεπαίνειν τοῖς ἁμαρτανομένοις"
              href: grc/diatribe/1-18.qmd
            - text: "ιθʹ · πῶς ἔχειν δεῖ πρὸς τοὺς τυράννους"
              href: grc/diatribe/1-19.qmd
            - text: "κʹ · περὶ τοῦ λόγου πῶς αὑτοῦ θεωρητικός ἐστιν"
              href: grc/diatribe/1-20.qmd
            - text: "καʹ · πρὸς τοὺς θαυμάζεσθαι θέλοντας"
              href: grc/diatribe/1-21.qmd
            - text: "κβʹ · περὶ τῶν προλήψεων"
              href: grc/diatribe/1-22.qmd
            - text: "κγʹ · πρὸς Ἐπίκουρον"
              href: grc/diatribe/1-23.qmd
            - text: "κδʹ · πῶς πρὸς τὰς περιστάσεις ἀγωνιστέον"
              href: grc/diatribe/1-24.qmd
            - text: "κεʹ · πρὸς τὸ αὐτό"
              href: grc/diatribe/1-25.qmd
            - text: "κϛʹ · τίς ὁ βιωτικὸς νόμος"
              href: grc/diatribe/1-26.qmd
            - text: "κζʹ · ποσαχῶς αἱ φαντασίαι γίνονται καὶ τίνα πρόχειρα πρὸς αὐτὰς βοηθήματα παρασκευαστέον"
              href: grc/diatribe/1-27.qmd
            - text: "κηʹ · ὅτι οὐ δεῖ χαλεπαίνειν ἀνθρώποις καὶ τίνα τὰ μικρὰ καὶ μεγάλα ἐν ἀνθρώποις"
              href: grc/diatribe/1-28.qmd
            - text: "κθʹ · περὶ εὐσταθείας"
              href: grc/diatribe/1-29.qmd
            - text: "λʹ · τί δεῖ πρόχειρον ἔχειν ἐν ταῖς περιστάσεσιν"
              href: grc/diatribe/1-30.qmd
        - section: "Βιβλίον Βʹ"
          contents:
            - text: "αʹ · ὅτι οὐ μάχεται τὸ θαρρεῖν τῷ εὐλαβεῖσθαι"
              href: grc/diatribe/2-01.qmd
            - text: "βʹ · περὶ ἀταραξίας"
              href: grc/diatribe/2-02.qmd
            - text: "γʹ · πρὸς τοὺς συνιστάντας τινὰς τοῖς φιλοσόφοις"
              href: grc/diatribe/2-03.qmd
            - text: "δʹ · πρὸς τὸν ἐπὶ μοιχείᾳ ποτὲ κατειλημμένον"
              href: grc/diatribe/2-04.qmd
            - text: "εʹ · πῶς συνυπάρχει μεγαλοφροσύνη καὶ ἐπιμέλεια"
              href: grc/diatribe/2-05.qmd
            - text: "ϛʹ · περὶ ἀδιαφορίας"
              href: grc/diatribe/2-06.qmd
            - text: "ζʹ · πῶς μαντευτέον"
              href: grc/diatribe/2-07.qmd
            - text: "ηʹ · τίς οὐσία τοῦ ἀγαθοῦ"
              href: grc/diatribe/2-08.qmd
            - text: "θʹ · ὅτι οὐ δυνάμενοι τὴν ἀνθρώπου ἐπαγγελίαν πληρῶσαι τὴν φιλοσόφου προσλαμβάνομεν"
              href: grc/diatribe/2-09.qmd
            - text: "ιʹ · πῶς ἀπὸ τῶν ὀνομάτων τὰ καθήκοντα ἔστιν εὑρίσκειν"
              href: grc/diatribe/2-10.qmd
            - text: "ιαʹ · τίς ἀρχὴ φιλοσοφίας"
              href: grc/diatribe/2-11.qmd
            - text: "ιβʹ · περὶ τοῦ διαλέγεσθαι"
              href: grc/diatribe/2-12.qmd
            - text: "ιγʹ · περὶ τοῦ ἀγωνιᾶν"
              href: grc/diatribe/2-13.qmd
            - text: "ιδʹ · πρὸς Νάσωνα"
              href: grc/diatribe/2-14.qmd
            - text: "ιεʹ · πρὸς τοὺς σκληρῶς τισιν ὧν ἔκριναν ἐμμένοντας"
              href: grc/diatribe/2-15.qmd
            - text: "ιϛʹ · ὅτι οὐ μελετῶμεν χρῆσθαι τοῖς περὶ ἀγαθῶν καὶ κακῶν δόγμασιν"
              href: grc/diatribe/2-16.qmd
            - text: "ιζʹ · πῶς ἐφαρμοστέον τὰς προλήψεις τοῖς ἐπὶ μέρους"
              href: grc/diatribe/2-17.qmd
            - text: "ιηʹ · πῶς ἀγωνιστέον πρὸς τὰς φαντασίας"
              href: grc/diatribe/2-18.qmd
            - text: "ιθʹ · πρὸς τοὺς μέχρι λόγου μόνον ἀναλαμβάνοντας τὰ τῶν φιλοσόφων"
              href: grc/diatribe/2-19.qmd
            - text: "κʹ · πρὸς Ἐπικουρείους καὶ Ἀκαδημαικούς"
              href: grc/diatribe/2-20.qmd
            - text: "καʹ · περὶ ἀνομολογίας"
              href: grc/diatribe/2-21.qmd
            - text: "κβʹ · περὶ φιλίας"
              href: grc/diatribe/2-22.qmd
            - text: "κγʹ · περὶ τῆς τοῦ λέγειν δυνάμεως"
              href: grc/diatribe/2-23.qmd
            - text: "κδʹ · πρός τινα τῶν οὐκ ἠξιωμένων ὑπʼερ αὐτοῦ"
              href: grc/diatribe/2-24.qmd
            - text: "κεʹ · πῶς ἀναγκαῖα τὰ λογικά"
              href: grc/diatribe/2-25.qmd
            - text: "κϛʹ · τί τὸ ἴδιον τοῦ ἁμαρτήματος"
              href: grc/diatribe/2-26.qmd
        - section: "Βιβλίον Γʹ"
          contents:
            - text: "αʹ · περὶ καλλωπισμοῦ"
              href: grc/diatribe/3-01.qmd
            - text: "βʹ · περὶ τίνα ἀσκεῖσθαι δεῖ τὸν προκόψοντα καὶ ὅτι τῶν κυριωτάτων ἀμελοῦμεν"
              href: grc/diatribe/3-02.qmd
            - text: "γʹ · τίς ὕλη τοῦ ἀγαθοῦ καὶ πρὸς τί μάλιστʼ ἀσκητέον"
              href: grc/diatribe/3-03.qmd
            - text: "δʹ · πρὸς τὸν ἀκόσμως ἐν θεάτρῳ σπουδάσαντα"
              href: grc/diatribe/3-04.qmd
            - text: "εʹ · πρὸς τοὺς διὰ νόσον ἀπαλλαττομένους"
              href: grc/diatribe/3-05.qmd
            - text: "ϛʹ · σποράδην τινά"
              href: grc/diatribe/3-06.qmd
            - text: "ζʹ · πρὸς τὸν διορθωτὴν τῶν ἐλευθέρων πόλεων Ἐπικούρειον ὄντα"
              href: grc/diatribe/3-07.qmd
            - text: "ηʹ · πῶς πρὸς τὰς φαντασίας γυμναστέον"
              href: grc/diatribe/3-08.qmd
            - text: "θʹ · πρός τινα ῥήτορα ἀνιόντα εἰς Ῥώμην ἐπὶ δίκῃ"
              href: grc/diatribe/3-09.qmd
            - text: "ιʹ · πῶς φέρειν δεῖ τὰς νόσους"
              href: grc/diatribe/3-10.qmd
            - text: "ιαʹ · σποράδην τινά"
              href: grc/diatribe/3-11.qmd
            - text: "ιβʹ · περὶ ἀσκήσεως"
              href: grc/diatribe/3-12.qmd
            - text: "ιγʹ · τί ἐρημία καὶ ποῖος ἔρημος"
              href: grc/diatribe/3-13.qmd
            - text: "ιδʹ · σποράδην τινά"
              href: grc/diatribe/3-14.qmd
            - text: "ιεʹ · ὅτι δεῖ περιεσκεμμένως ἔρχεσθαι ἐφʼ ἕκαστα"
              href: grc/diatribe/3-15.qmd
            - text: "ιϛʹ · ὅτι εὐλαβῶς δεῖ συγκαθιέναι εἰς συμπεριφοράν"
              href: grc/diatribe/3-16.qmd
            - text: "ιζʹ · περὶ προνοίας"
              href: grc/diatribe/3-17.qmd
            - text: "ιηʹ · ὅτι οὐ δεῖ πρὸς τὰς ἀγγελίας ταράσσεσθαι"
              href: grc/diatribe/3-18.qmd
            - text: "ιθʹ · τίς στάσις ἰδιώτου καὶ φιλοσόφου"
              href: grc/diatribe/3-19.qmd
            - text: "κʹ · ὅτι ἀπὸ πάντων τῶν ἐκτὸς ἔστιν ὠφελεῖσθαι"
              href: grc/diatribe/3-20.qmd
            - text: "καʹ · πρὸς τοὺς εὐκόλως ἐπὶ τὸ σοφιστεύειν ἐρχομένους"
              href: grc/diatribe/3-21.qmd
            - text: "κβʹ · περὶ Κυνισμοῦ"
              href: grc/diatribe/3-22.qmd
            - text: "κγʹ · πρὸς τοὺς ἀναγιγνώσκοντας καὶ διαλεγομένους ἐπιδεικτικῶς"
              href: grc/diatribe/3-23.qmd
            - text: "κδʹ · περὶ τοῦ μὴ δεῖν προσπάσχειν τοῖς οὐκ ἐφʼ ἡμῖν"
              href: grc/diatribe/3-24.qmd
            - text: "κεʹ · πρὸς τοὺς ἀποπίπτοντας ὧν προέθεντο"
              href: grc/diatribe/3-25.qmd
            - text: "κϛʹ · πρὸς τοὺς τὴν ἀπορίαν δεδοικότας"
              href: grc/diatribe/3-26.qmd
        - section: "Βιβλίον Δʹ"
          contents:
            - text: "αʹ · περὶ ἐλευθερίας"
              href: grc/diatribe/4-01.qmd
            - text: "βʹ · περὶ συμπεριφορᾶς"
              href: grc/diatribe/4-02.qmd
            - text: "γʹ · τίνα τίνων ἀντικαταλλακτέον"
              href: grc/diatribe/4-03.qmd
            - text: "δʹ · πρὸς τοὺς περὶ τὸ ἐν ἡσυχίᾳ διάγειν ἐσπουδακότας"
              href: grc/diatribe/4-04.qmd
            - text: "εʹ · πρὸς τοὺς μαχίμους καὶ θηριώδεις"
              href: grc/diatribe/4-05.qmd
            - text: "ϛʹ · πρὸς τοὺς ἐπὶ τῷ ἐλεεῖσθαι ὀδυνωμένους"
              href: grc/diatribe/4-06.qmd
            - text: "ζʹ · περὶ ἀφοβίας"
              href: grc/diatribe/4-07.qmd
            - text: "ηʹ · πρὸς τοὺς ταχέως ἐπὶ τὸ σχῆμα τῶν φιλοσόφων ἐπιπηδῶντας"
              href: grc/diatribe/4-08.qmd
            - text: "θʹ · πρὸς τὸν εἰς ἀναισχυντίαν μεταβληθέντα"
              href: grc/diatribe/4-09.qmd
            - text: "ιʹ · τίνων δεῖ καταφρονεῖν καὶ πρὸς τίνα διαφέρεσθαι"
              href: grc/diatribe/4-10.qmd
            - text: "ιαʹ · περὶ καθαριότητος"
              href: grc/diatribe/4-11.qmd
            - text: "ιβʹ · περὶ προσοχῆς"
              href: grc/diatribe/4-12.qmd
            - text: "ιγʹ · πρὸς τοὺς εὐκόλως ἐκφέροντας τὰ αὑτῶν"
              href: grc/diatribe/4-13.qmd
        - text: "---"
        - text: "Περὶ τῆς ἐκδόσεως"
          href: grc/credits.qmd

