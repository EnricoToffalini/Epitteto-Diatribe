<!--
Language switcher.

The site is one Quarto project with a subtree per edition (it/, en/, grc/).
Every page has a counterpart at the same relative path in the other two, so
switching language keeps the reader on the same diatribe instead of sending
them back to a home page.

Without JavaScript the flags still work: they are ordinary links to each
edition's home page.  This script only upgrades them to point at the
counterpart of the page actually being read, and relabels the navbar, which
Quarto can only write once and therefore writes in Italian.

Settings (languages, page list, navbar labels) come from lang-config.html,
which tools/2_generate_site.py regenerates.  This file is the logic only and
can be edited by hand.
-->
<script>
(() => {
  const cfg = window.EPICTETUS || {};
  const langs = cfg.langs || [];
  const fallback = cfg.default || langs[0];
  if (!langs.length) return;

  const known = new Set(cfg.pages || []);

  // Language links are marked with an .ep-lang span carrying data-lang, in the
  // navbar, in the sidebar and on the root landing page alike.
  const flagLinks = [];
  document.querySelectorAll(".ep-lang[data-lang]").forEach((span) => {
    const anchor = span.closest("a");
    const lang = span.dataset.lang;
    if (anchor && langs.includes(lang)) flagLinks.push({ lang, anchor });
  });
  if (!flagLinks.length) return;

  // Derive the site root from a language link, so the switcher works both at
  // the domain root and under a GitHub Pages project subpath.
  let root;
  for (const { lang, anchor } of flagLinks) {
    const path = new URL(anchor.href, location.href).pathname;
    const suffix = lang + "/index.html";
    if (path.endsWith(suffix)) {
      root = path.slice(0, path.length - suffix.length);
      break;
    }
  }
  if (root === undefined) return;

  // Split the current location into "which language" and "which page".
  const here = location.pathname.startsWith(root)
    ? location.pathname.slice(root.length)
    : "";
  const segments = here.split("/");
  const inLanguage = langs.includes(segments[0]);
  const current = inLanguage ? segments[0] : fallback;
  let page = (inLanguage ? segments.slice(1).join("/") : here) || "index.html";
  if (page.endsWith("/")) page += "index.html";

  const target = (lang) =>
    root + lang + "/" + (known.size === 0 || known.has(page) ? page : "index.html");

  // Point each flag at the counterpart of the page being read.  On the root
  // landing page no edition is marked as the one currently being read.
  flagLinks.forEach(({ lang, anchor }) => {
    anchor.href = target(lang) + location.hash;
    anchor.setAttribute("hreflang", lang);
    anchor.classList.add("ep-lang-link");
    anchor.classList.toggle("ep-lang-active", inLanguage && lang === current);
    if (inLanguage && lang === current) anchor.setAttribute("aria-current", "true");
  });

  // The navbar is shared by the whole site and is generated in the default
  // language: re-point and re-label it when another edition is being read.
  const brand = document.querySelector("#quarto-header .navbar-brand");
  if (brand && cfg.brand && cfg.brand[current]) {
    const label = brand.querySelector(".navbar-title") || brand;
    label.textContent = cfg.brand[current];
  }
  if (!inLanguage || current === fallback) return;

  const prefix = root + fallback + "/";
  const labels = (cfg.nav || {})[current] || {};
  document.querySelectorAll("#quarto-header a[href]").forEach((anchor) => {
    if (anchor.classList.contains("ep-lang-link")) return;
    const url = new URL(anchor.href, location.href);
    if (!url.pathname.startsWith(prefix)) return;
    const targetPage = url.pathname.slice(prefix.length);
    anchor.href = root + current + "/" + targetPage + url.hash;
    const label = labels[targetPage];
    if (label) anchor.textContent = label;
  });

  // Book menus carry no href of their own, so they are relabelled by position.
  const books = (cfg.books || {})[current] || [];
  document.querySelectorAll("#quarto-header .dropdown-toggle").forEach((toggle, index) => {
    if (books[index]) toggle.textContent = books[index];
  });
})();
</script>
